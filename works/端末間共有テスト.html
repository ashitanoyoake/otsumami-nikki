<script>
(function () {
  var dialog = document.getElementById('work-lightbox');
  if (!dialog || typeof dialog.showModal !== 'function') return;
  var image = dialog.querySelector('.work-lightbox__image');
  if (!image) return;
  document.addEventListener('click', function (event) {
    var target = event.target;
    if (!(target instanceof Element)) return;
    var trigger = target.closest('[data-work-lightbox-src]');
    if (!trigger) return;
    var src = trigger.getAttribute('data-work-lightbox-src');
    if (!src) return;
    event.preventDefault();
    image.setAttribute('src', src);
    image.setAttribute('alt', trigger.getAttribute('data-work-lightbox-alt') || '');
    dialog.showModal();
  });
  dialog.addEventListener('click', function (event) {
    if (event.target === dialog) dialog.close();
  });
})();
