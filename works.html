<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お仕事 | おつまみ日記！</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="site-logo">
      <img src="images/logo.png" alt="" class="site-logo-image" width="48" height="48">
      <span>おつまみ日記！</span>
    </a>
    <nav aria-label="メインナビゲーション">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="instagram.html">Instagram</a></li>
        <li><a href="works.html" class="nav-current">お仕事</a></li>
        <li><a href="blog.html">ブログ</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <main class="content-inner page-main">
    <header class="page-header">
      <div class="page-deco">
        <div class="placeholder deco-placeholder">イラスト予定</div>
      </div>
      <h1 class="page-title">お仕事</h1>
      <p class="page-lead">これまでに制作したイラストやご依頼作品をご紹介します。</p>
    </header>

    <div class="works-entries">

      <article
        class="works-entry"
        data-slug="jido-sashie"
        data-category="illustration"
        data-year="2025"
        data-status="published"
      >
        <a href="works/children-book-illustration/" class="works-entry-link">
          <figure class="works-entry-thumb">
            <div class="works-thumb-placeholder" role="img" aria-label="作品画像予定">作品画像予定</div>
          </figure>
          <div class="works-entry-info">
            <span class="works-entry-category">イラスト</span>
            <h2 class="works-entry-title">児童書籍 挿絵</h2>
            <p class="works-entry-summary">児童向け書籍の挿絵を担当しました。</p>
          </div>
          <span class="works-entry-arrow" aria-hidden="true">→</span>
        </a>
      </article>

      <article
        class="works-entry"
        data-slug="web-renzai"
        data-category="illustration"
        data-year="2024"
        data-status="published"
      >
        <a href="works/web-renzai/" class="works-entry-link">
          <figure class="works-entry-thumb">
            <div class="works-thumb-placeholder" role="img" aria-label="作品画像予定">作品画像予定</div>
          </figure>
          <div class="works-entry-info">
            <span class="works-entry-category">イラスト</span>
            <h2 class="works-entry-title">Web メディア 連載イラスト</h2>
            <p class="works-entry-summary">連載記事のイラストを制作しました。</p>
          </div>
          <span class="works-entry-arrow" aria-hidden="true">→</span>
        </a>
      </article>

      <article
        class="works-entry"
        data-slug="original-goods"
        data-category="design-illustration"
        data-year="2023"
        data-status="published"
      >
        <a href="works/original-goods/" class="works-entry-link">
          <figure class="works-entry-thumb">
            <div class="works-thumb-placeholder" role="img" aria-label="作品画像予定">作品画像予定</div>
          </figure>
          <div class="works-entry-info">
            <span class="works-entry-category">デザイン・イラスト</span>
            <h2 class="works-entry-title">オリジナルグッズ デザイン</h2>
            <p class="works-entry-summary">キャラクターグッズのイラストを制作しました。</p>
          </div>
          <span class="works-entry-arrow" aria-hidden="true">→</span>
        </a>
      </article>

    </div>
  </main>

  <footer class="site-footer">
    <p class="footer-site-name">おつまみ日記！</p>
    <p class="footer-copy">© 2026 おつまみ日記！</p>
  </footer>

</body>
</html>
