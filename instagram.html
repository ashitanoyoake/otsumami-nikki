<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram | おつまみ日記！</title>
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/favicon-512x512.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="site-logo">
      <img src="images/logo.png" alt="" class="site-logo-image" width="48" height="48">
      <span>おつまみ日記！</span>
    </a>
    <nav aria-label="メインナビゲーション">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="instagram.html" class="nav-current">Instagram</a></li>
        <li><a href="works.html">お仕事</a></li>
        <li><a href="blog.html">ブログ</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <main class="content-inner page-main">
    <header class="page-header">
      <div class="page-deco">
        <img src="images/instagram.png" alt="" class="page-deco-image" width="160" height="160">
      </div>
      <h1 class="page-title">Instagram</h1>
      <p class="page-lead">いろいろな日常を記録中 (・ω・)つ⊹₊˚✧･</p>
    </header>

    <div data-instagram-gallery data-instagram-limit="9">
      <div class="gallery gallery-instagram instagram-gallery" hidden></div>
      <p class="instagram-gallery-message">読み込み中...</p>
    </div>
    <p class="section-link">
      <a href="https://www.instagram.com/tsumami_life/" target="_blank" rel="noopener noreferrer">Instagram アカウントを見る →</a>
    </p>
  </main>

  <footer class="site-footer">
    <p class="footer-site-name">おつまみ日記！</p>
    <p class="footer-copy">© 2026 おつまみ日記！</p>
  </footer>

  <div class="instagram-modal" role="dialog" aria-modal="true" aria-label="Instagram投稿の拡大表示" hidden>
    <div class="instagram-modal-inner">
      <button type="button" class="instagram-modal-prev" aria-label="前の画像" hidden>←</button>
      <button type="button" class="instagram-modal-next" aria-label="次の画像" hidden>→</button>
      <figure class="instagram-modal-figure instagram-modal-stage">
        <div class="instagram-modal-image-wrap">
          <img class="instagram-modal-image" src="" alt="">
          <button type="button" class="instagram-modal-close" aria-label="閉じる">×</button>
        </div>
        <p class="instagram-modal-counter" hidden aria-live="polite"></p>
        <figcaption class="instagram-modal-caption">
          <a class="instagram-modal-link" href="#" target="_blank" rel="noopener noreferrer">Instagramで投稿を見る</a>
        </figcaption>
      </figure>
    </div>
  </div>

  <script src="js/instagram-gallery.js"></script>
</body>
</html>
